name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 markdownlint
        run: npm install -g markdownlint-cli
      - name: 检查所有md文档
        run: markdownlint '**/*.md' --ignore '**/node_modules/**' --ignore '**/.venv/**' --ignore 'presets/**/prompt.md'

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck 脚本检查
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行单元测试
        run: pytest
